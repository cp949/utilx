<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>utilx 브라우저 검증 fixture</title>
  </head>
  <body>
    <h1>utilx 브라우저 검증 fixture</h1>

    <section>
      <h2>다운로드</h2>
      <button id="dl-blob-ascii">downloadBlob ASCII</button>
      <button id="dl-blob-korean">downloadBlob 한글</button>
      <button id="dl-blob-binary">downloadBlob 바이너리</button>
      <button id="dl-text-korean">downloadText 한글</button>
      <button id="dl-text-default">downloadText 기본 MIME</button>
      <button id="dl-url-named">downloadUrl 이름 지정</button>
      <button id="dl-url-unnamed">downloadUrl 이름 생략</button>
    </section>

    <section>
      <h2>이벤트</h2>
      <div id="parent"><button id="child">자식</button></div>
    </section>

    <section>
      <h2>클립보드</h2>
      <button id="copy">복사</button>
      <output id="copy-result"></output>
    </section>

    <script type="module" src="/harness.js"></script>
  </body>
</html>
